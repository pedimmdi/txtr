services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: txtr
      POSTGRES_USER: txtr
      POSTGRES_PASSWORD: txtr
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U txtr -d txtr"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./core:/app/core
    ports:
      - "8000:8000"
    env_file:
      - ./core/.env
    environment:
      DATABASE_URL: postgres://txtr:txtr@db:5432/txtr
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,web
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: